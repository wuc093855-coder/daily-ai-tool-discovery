name: 每日更新并部署

on:
  schedule:
    # GitHub Actions 使用 UTC；00:30 UTC = 北京时间 08:30。
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-ai-tools-pages"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 运行 Python 测试
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: 运行前端逻辑测试
        run: node --test tests/frontend.test.mjs

      - name: 生成并校验现有静态文件
        run: python scripts/site_builder.py

      - name: 收集并筛选今日工具
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_tools.py

      - name: 最终校验数据
        run: python scripts/site_builder.py --validate-only

      - name: 保存每日更新
        if: github.event_name != 'push'
        shell: bash
        run: |
          if git diff --quiet -- docs/data docs/feed.xml docs/sitemap.xml docs/index.html; then
            echo "今日数据与生成文件没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/feed.xml docs/sitemap.xml docs/index.html
          UPDATE_DATE="$(TZ=Asia/Shanghai date +%F)"
          git commit -m "chore: update AI tools ${UPDATE_DATE} [skip ci]"
          git push

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网页
        uses: actions/upload-pages-artifact@v4
        with:
          path: "docs"

  deploy:
    runs-on: ubuntu-latest
    needs: update
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
