name: 每日更新并部署

on:
  schedule:
    # GitHub Actions cron uses UTC. 00:30 UTC = 08:30 Asia/Shanghai.
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 收集并筛选今日工具
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_tools.py

      - name: 保存今日内容
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- docs/data/daily.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "今日数据没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/daily.json
          git commit -m "chore: update daily AI tools [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网页
        uses: actions/upload-pages-artifact@v4
        with:
          path: "docs"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
